# Supabase CLI local development configuration
# https://supabase.com/docs/guides/local-development/cli/config

[api]
port = 54321

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback"
]
enable_signup = true

[auth.email]
enable_signup = true
# Require users to confirm their email before signing in (false = passwordless OTP works immediately)
enable_confirmations = false
# Use our branded template that includes both the magic-link button AND {{ .Token }} OTP code
[auth.email.template.magic_link]
subject = "Your Surekh Sign-In Code"
content_path = "./supabase/email-templates/magic-link.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = true
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false

# Define test OTP mapping using the correct subsection name
[auth.sms.test_otp]
"+919876543210" = "123456"

# Configure Twilio provider and set enabled = true
[auth.sms.twilio]
enabled = true
account_sid = "test"
auth_token = "test"
message_service_sid = "test"
